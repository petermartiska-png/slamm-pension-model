            social_insurance_contribution_vyp():
                - social_insurance_contribution: if(pays_social_contributions, nominal_wage * SOCIAL_INSURANCE_CONTRIB_RATE, 0)
                - oldage_insurance_contribution: if(pays_social_contributions, nominal_wage * oldage_insurance_contrib_rate, 0)
                - disability_insurance_contribution: if(pays_social_contributions, nominal_wage * disability_insurance_contrib_rate, 0)
                - reserve_fund_contribution: if(pays_social_contributions, nominal_wage * reserve_fund_contrib_rate, 0)
                - pension_relevant_contribution: oldage_insurance_contribution + disability_insurance_contribution + reserve_fund_contribution
                - pillar2_contribution: if(pays_social_contributions and pillar2_saver, nominal_wage * if(period < 2025, pillar2_contrib_rate_pre_2025, if(period < 2027, pillar2_contrib_rate_2025_2026, pillar2_contrib_rate)), 0)
