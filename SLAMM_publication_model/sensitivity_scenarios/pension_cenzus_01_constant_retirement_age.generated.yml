            # ODP
            pridat_odp():
                - odp: if(IS_EMPLOYED or IS_DISABLED, odp + 1, odp)
                - roky_pomb: if(IS_EMPLOYED or disabled_working, roky_pomb + 1, roky_pomb)
                - odp_sk: if(awg_migrant and (IS_EMPLOYED or IS_DISABLED), odp_sk + 1, odp_sk)
                - roky_pomb_sk: if(awg_migrant and (IS_EMPLOYED or disabled_working), roky_pomb_sk + 1, roky_pomb_sk)
                
            # POMB - z vypoctu POMB su vylucene nahradne doby a invalidita (ak neexistoval VZ)
            vypocet_pomb():
                # Annual OMB is capped at 3, so cumulative_omb implies at least
                # cumulative_omb / 3 contributory years. Keep raw roky_pomb for diagnostics.
                - roky_pomb_for_calc: max(roky_pomb, cumulative_omb / 3)
                - pomb: if(roky_pomb_for_calc > 0, cumulative_omb / roky_pomb_for_calc, 0)
                # 0,3 za nahradne doby
                #- nd_roky: if(odp > roky_pomb, odp - roky_pomb, 0)
                #- pomb: if(roky_pomb + nd_roky > 0,
                #          pomb + (0.3 * nd_roky)*0.5,
                #          0)
                # solidarizacia
                - pomb: if(pomb==0, 0,
                        if(pomb > 1.25, 1.25 + (pomb - 1.25) * 0.68,
                        if(pomb < 1.0, pomb + (1.0 - pomb) * 0.20, pomb)))
                - roky_pomb_sk_for_calc: max(roky_pomb_sk, cumulative_omb_sk / 3)
                - pomb_sk: if(roky_pomb_sk_for_calc > 0, cumulative_omb_sk / roky_pomb_sk_for_calc, 0)
                - pomb_sk: if(pomb_sk==0, 0,
                        if(pomb_sk > 1.25, 1.25 + (pomb_sk - 1.25) * 0.68,
                        if(pomb_sk < 1.0, pomb_sk + (1.0 - pomb_sk) * 0.20, pomb_sk)))
                
            pension_vyp():
                - odp_pension: odp + 0.3 * max(0, 40 - odp)
                - pillar2_years: if(pillar2_saver and pillar2_entry_year > 0 and period > pillar2_entry_year and odp_pension > 0,
