                                    avg(max(0, pension_oldage_full + pension_survivor_full - pension_total), filter=pension_has_overlap == 1 and retired and not retired_early and not disabled and material_need_pension_benefit == 0),
                                    avg(pension, filter=retired_early and material_need_pension_benefit == 0),
                                    avg(pension, filter=disabled and not retired_early and material_need_pension_benefit == 0),
                                    avg(minimum_pension_benefit, filter=minimum_pension_benefit > 0),
                                    avg(material_need_pension_benefit, filter=material_need_pension_benefit > 0),
                                    avg(replacement_rate, filter=NEW_RETIRED and replacement_rate > 0),
                                    avg(benefit_ratio, filter=retired and not retired_early and not disabled and pension_oldage > 0),
                                    sum(oldage_insurance_contribution) * oldage_contribution_effective_collection_factor * 12 * 5,
                                    sum(disability_insurance_contribution) * disability_contribution_effective_collection_factor * 12 * 5,
                                    sum(reserve_fund_contribution) * reserve_fund_contribution_effective_collection_factor * 12 * 5,
                                    (sum(oldage_insurance_contribution) * oldage_contribution_effective_collection_factor + sum(disability_insurance_contribution) * disability_contribution_effective_collection_factor + sum(reserve_fund_contribution) * reserve_fund_contribution_effective_collection_factor) * 12 * 5,
                                    sum(pillar2_contribution) * pillar2_contribution_effective_collection_factor * 12 * 5,
                                    (sum(oldage_insurance_contribution) * oldage_contribution_effective_collection_factor - sum(pillar2_contribution) * pillar2_contribution_effective_collection_factor) * 12 * 5,
                                    sum(social_insurance_contribution) * social_insurance_contribution_effective_collection_factor * 12 * 5,
                                    count(status == 1) * 5,
                                    count(pays_social_contributions) * 5,
                                    count(retired and not retired_early and not disabled and pension_oldage > 0 and material_need_pension_benefit == 0 and pillar2_years > 0) * 5,
                                    count(pillar2_contribution > 0) * 5,
                    fname='pension_expenditure_summary_formatted.csv', mode='a')

            
               
simulation:
   init: 
        - person: [init_variable, init_define, time_to_leave1, edulev_init, init_disab, init_retired, init_non_covered, init_disab_pens, init_pillar2_savers, csv_pillar2_stock]

   processes:   
        - person: [ageing, birth, awg_baseyear_age1_cohort, death, awg_migration, immigration, edulev, edufield, later_studying, statusing, study, disability, retirement, inactivity, economic_activity, employment, employment_nace_score, employment_nace, employment_nace_qual, unemployment, pillar2_mandatory_entry, pillar2_return_entry, maternity, wages, nominal_wage_vyp, social_contribution_payer_vyp, social_insurance_contribution_vyp, pridat_odp, vypocet_pomb, pension_vyp, csv_pension_expenditure, csv_benefit_replacement_detail, awg_initial_population_stock_calibration, awg_initial_population_stock_calibration_remove] 
        #- person: [historical_year, ageing, rebirth, maternity, immigration, statusing, study, retirement, disability, inactivity, economic_activity, employment_nace_score, employment, unidentified]        
        #- person: [csv_empl]
        - person: [csv_all]
   
   input:
