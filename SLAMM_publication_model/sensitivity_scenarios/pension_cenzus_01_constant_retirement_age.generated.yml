                - pension_new: if(NEW_RETIRED and toret>0, pension_new * (1 + 0.06 * trunc(toret)), pension_new)
                - pension_new_full_eu: if(NEW_RETIRED and awg_migrant, pension_new, pension_new_full_eu)
                - eu_pension_proration: if(NEW_RETIRED and awg_migrant and roky_pomb > 0, min(1, roky_pomb_sk / roky_pomb), eu_pension_proration)
                - pension_new: if(NEW_RETIRED and awg_migrant, pension_new * eu_pension_proration, pension_new)
                - pillar2_pension_reduction: if(NEW_RETIRED and odp_pension>=15 and pillar2_years > 0,
                                                pension_new * (pillar2_years / odp_pension) * pillar2_first_pillar_reduction_rate,
