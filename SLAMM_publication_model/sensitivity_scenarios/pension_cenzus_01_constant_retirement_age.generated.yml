                - survivor_existing_benefit_uplift: if(period == 2025, survivor_benefit_uplift_factor, 1)
                - pension_survivor: if(retired and not disabled and not NEW_RETIRED and not EARLY_RETIRED,
                                       pension_survivor * (1 + VALORIZACIA) * (1 + MIMORIADNA) * survivor_existing_benefit_uplift,
                                       pension_survivor)
                - pension_widow: if(retired and not disabled and not NEW_RETIRED and not EARLY_RETIRED,
