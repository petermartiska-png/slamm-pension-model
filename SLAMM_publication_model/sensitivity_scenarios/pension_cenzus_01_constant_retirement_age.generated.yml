                - eu_pension_proration: if(disabled and toret>=0 and awg_migrant and roky_pomb > 0, min(1, roky_pomb_sk / roky_pomb), eu_pension_proration)
                - disability_oldage_pension: if(disabled and toret>=0 and awg_migrant, disability_oldage_pension * eu_pension_proration, disability_oldage_pension)
                - pillar2_pension_reduction: if(disabled and toret>=0 and pillar2_years > 0,
                                                disability_oldage_pension * (pillar2_years / odp) * pillar2_first_pillar_reduction_rate,
