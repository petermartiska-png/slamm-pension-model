                          max(omb, older_worker_omb_floor_factor_69_plus * avg(omb, filter=(IS_EMPLOYED or disabled_working) and ISFEMALE and age >= 60 and age <= 64 and omb > 0)),
                          omb)
                
            # OMB pre matky na urovni minimalnej mzdy - 60% priemernej mzdy spred dvoch rokov = pribli??ne 55% priemernej mzdy v tomto roku
                - omb: if(MOTHER, 0.55, omb)
                - omb: if(disabled_working, omb + 0.3, omb)

            # From 2025, keep the aggregate wage distribution consistent with
            # MONTHLY_AVG_WAGE by normalising mean OMB among ordinary employed
            # persons to 1. Use ordinary employment (status == 1) to calculate
            # the factor because contribution payers are selected randomly only
            # afterwards. Apply the same factor to all positive labour-income
            # OMBs, including disabled workers, so that relative group wage
            # differences are preserved. This is deliberately done after the
            # wage floors and group-specific adjustments, but before OMB career
            # accumulation, nominal wages and contributions.
                - omb: if(period >= 2025 and (IS_EMPLOYED or disabled_working) and omb > 0 and avg(omb, filter=IS_EMPLOYED and omb > 0) > 0,
                          omb / avg(omb, filter=IS_EMPLOYED and omb > 0),
                          omb)
                
            # Kumulacia OMB pre vypocet POMB
                - cumulative_omb: if(IS_EMPLOYED or disabled_working, cumulative_omb + omb, cumulative_omb)
                - cumulative_omb_sk: if(awg_migrant and (IS_EMPLOYED or disabled_working), cumulative_omb_sk + omb, cumulative_omb_sk)

            nominal_wage_vyp():
                - nominal_wage: if(status == 1, omb * MONTHLY_AVG_WAGE, 0)
                - last_nominal_wage: if(nominal_wage > 0, nominal_wage, last_nominal_wage)
                - last_wage_level: if(nominal_wage > 0, omb, last_wage_level)

            social_contribution_payer_vyp():
                - pays_social_contributions_score: uniform()
                - pays_social_contributions: status == 1 and align_abs(pays_social_contributions_score,
                                                                        round(count(status == 1) * if(period == base_year,
                                                                                                      social_contribution_payer_baseyear_alignment_ratio,
                                                                                                      social_contribution_payer_future_alignment_ratio)),
