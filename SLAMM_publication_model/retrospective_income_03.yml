globals: 
     base_year: 2022

     align_omb:
         path: align_omb.csv
         fields:
         - PERIOD: int
         - MEAN_OMB: float
     
     edutable:
         path: edu_level.csv
         fields:
         - PERIOD: int
         - PL: float
         - LSL: float
         - HSL: float
         - PSL: float
         - TL: float
         # input global variables - retirement age, average wage, share of unemployment rate and elasticity of inactivity              
     globaltable:
         path: globaltable_retro.csv 
         transposed: True 
         fields:
            - PERIOD: int
            - N1: int
            - N2: int 
            - N3: int 
            - N4: int 
            - N5: int 
            - UR: float 
            - inac_elas: float
            - MALE_RA: float
            - FEMALE_RA_0: float 
            - FEMALE_RA_1: float 
            - FEMALE_RA_2: float 
            - FEMALE_RA_3_4: float 
            - FEMALE_RA_5: float            
            - W_avg: float
            - unem_rate: float              


