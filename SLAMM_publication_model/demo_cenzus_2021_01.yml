globals:
     # Historically anchored scaling of the legacy return-emigration hazards.
     # The unscaled duration profile is retained, but its level is reduced so
     # that the 2023 full-population emigration flow is approximately aligned
     # with the observed Slovak flow (4,522 versus 26,410 in the prior run).
     # AWG net migration remains binding by sex and five-year age group because
     # immigration is calculated after departures as net target + departures.
     migration_departure_hazard_multiplier: 0.17
     # Optional one-time reconciliation of the 2022 population stock to the
     # AWG single-year-of-age and sex targets. Keep 0 for the Census-based
     # baseline; set to 1 for an AWG-initial-population comparison scenario.
     awg_initial_population_calibration: 0
     # Reconstruct the cohort born in 2021, which is absent from the census
     # input but must be age 1 after the first prospective ageing step. Targets
     # are the AWG 2022 age-1 populations divided by the 20% sample multiplier.
     awg_baseyear_age1_male_sample: 5921
     awg_baseyear_age1_female_sample: 5702
