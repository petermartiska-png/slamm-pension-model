        processes:             
            init_variable():
               - sex: if(pohlavie==1, 1, 2)
               - isco: isco
               - age: vek
               - nace: nace
               - status: ekon_status 
               - country_b: country_b
               - hatlev5: vzdelanie
               - qual: isco
               
            init_define():   
               - status: if(status==3 or status==4 or status==5 or status==6, 3, status)
               - status: if(status==7, 4, status)
               - status: if(age<=15 and (status==8 or status==9), 3, status)
               - status: if((status==8 or status==9) and nace>0, 1, status)
               - status: if((status==8 or status==9) and isco>0, 1, status)
               - status: if(status==8, 5, status)
               - status: if(status==9, 5, status)
               - status: if(status==3 and age>=50, 5, status)
               - status: if(status==5 and age>=63, 4, status)
               
