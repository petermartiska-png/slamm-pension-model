               - nace3_score: if(ea, logit_score(ISFEMALE*(-0.2145219)+PRIMARY*(0.2900285)+LOWER_SECONDARY*(0.4649834)+UPPER_SECONDARY*(0.508335)+POST_SECONDARY*(0.3136654)+FIELD1*(-1.626115)+FIELD2*(0.042604)+FIELD3*(-0.0646168)+FIELD4*(0.2220665)+FIELD5*(0.8297565)+FIELD6*(0.537337)+FIELD7*(1.220684)+FIELD8*(0.5244265)+FIELD9*(-1.454127)+FIELD10*(0.3388227)+AGEG22*(3.92983)+AGEG27*(4.445998)+AGEG32*(4.544755)+AGEG37*(4.59592)+AGEG42*(4.541563)+AGEG47*(4.467055)+AGEG52*(4.415977)+AGEG57*(4.040288)+AGEG62*(2.418583)+1*(-6.998593)),0)
               - nace4_score: if(ea, logit_score(ISFEMALE*(-1.422464)+PRIMARY*(0.2532183)+LOWER_SECONDARY*(-0.642902)+UPPER_SECONDARY*(-0.316109)+POST_SECONDARY*(-0.2083604)+FIELD1*(0.0570321)+FIELD2*(0.4518148)+FIELD3*(0.0012872)+FIELD4*(1.068047)+FIELD5*(0.9346451)+FIELD6*(0.6444659)+FIELD7*(1.343524)+FIELD8*(0.4903086)+FIELD10*(-0.1907229)+AGEG22*(3.417404)+AGEG27*(4.345674)+AGEG32*(5.036765)+AGEG37*(5.491537)+AGEG42*(5.421031)+AGEG47*(5.56431)+AGEG52*(5.700053)+AGEG57*(5.576496)+AGEG62*(4.191482)+1*(-9.523405)),0)
               - nace5_score: if(ea, logit_score(ISFEMALE*(-2.439621)+PRIMARY*(-0.0312407)+LOWER_SECONDARY*(0.5360953)+UPPER_SECONDARY*(0.2639153)+POST_SECONDARY*(-0.7240419)+FIELD0*(1.424968)+FIELD1*(-1.441081)+FIELD2*(-0.6684172)+FIELD3*(-0.4379628)+FIELD4*(0.2692311)+FIELD5*(-0.0942152)+FIELD6*(-0.5239734)+FIELD7*(0.9583526)+FIELD8*(0.25425)+FIELD9*(-1.031687)+FIELD10*(-0.182302)+AGEG17*(1.745068)+AGEG22*(3.902827)+AGEG27*(4.472909)+AGEG32*(4.484207)+AGEG37*(4.363429)+AGEG42*(4.286719)+AGEG47*(4.436202)+AGEG52*(4.456752)+AGEG57*(4.257444)+AGEG62*(3.221776)+1*(-7.242125)),0)
                              
                              
               - nace1_score: nace1_score + 1  
               - nace2_score: nace2_score + 1    
               - nace3_score: nace3_score + 1                   
               - nace4_score: nace4_score + 1
