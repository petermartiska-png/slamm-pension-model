####################################################################               
##  Those, assigned as economically active in the EA module, but not assigned as employed by the matching in the EMPL module are considered to be unemployed and their status 
##  is being changed accordingly. 
####################################################################       
               
            unemployment():               
               # From 2023 onward disabled pensioners enter economic activity
               # through the AWG participation alignment. The ordinary NACE
               # matching above determines whether they are employed; only a
               # matched disabled person is flagged as disabled_working.
               # The first two assignments preserve the legacy 2022 logic.
               - employed: if(period < 2023 and disabled_working, True, employed)
               - status: if(period < 2023 and disabled_working, EMPLOYED, status)
               - disabled_working: if(period >= 2023 and disabled, ea and employed and nace != -1, disabled_working)
               - employed: if(retired_early, False, employed)
               - nace: if(period <= base_year + 1 and ea and status1y == EMPLOYED and nace == -1 and nace1y > 0 and not disabled,
                          nace1y,
                          nace)
               - qual: if(period <= base_year + 1 and ea and status1y == EMPLOYED and qual == -1 and qual1y > 0 and not disabled,
                          qual1y,
                          qual)
               - employed: if(period <= base_year + 1 and ea and status1y == EMPLOYED and nace != -1 and not disabled,
                              True,
                              employed)
               - status: if(ea and nace==-1, UNEMPLOYED, status)
               - status: if(ea and not nace==-1, EMPLOYED, status)
               # Preserve the pre-change condition because process assignments
               # are sequential: a non-working person reclassified as retired
               # must no longer remain economically active.
               - becomes_nonworking_retired: ea and status==UNEMPLOYED and toret>=0 and not disabled
               - status: if(becomes_nonworking_retired, RETIRED, status)
               - ea: if(becomes_nonworking_retired, False, ea)
               - status: if(retired_early, RETIRED, status)

###################################################################
##  After all the simulation processes are performed, in the very last step, the results of the simulation are recorded in a spreadsheet format. This final process named 
##  “csv_output” used a LIAM2 build in function ”csv”. This function saves a spreadsheet file in CSV format following the structure predefined in the attributes of the command,
##  defines the name of the file saved file (the default location for saving these files is the “OUTPUT_DATA” defined in the Simulation section of the script.
##  Before the creating the csv files, working variables (replacement and matched) are defined. Some of them are going to be used in the csv exports. The only csv file being 
##  created by the documented version of the script is the follows :
##  csv (period, groupby(period, sex, status, period), fname='status.csv', mode='a'), where
##  Where: 
##  period – indicate year of simulation to be used in the first (left) column of the newly created table (A column, when opened in MS Excel)
##  groupby – saves counts by the categories defined in the brackets (period, sex, status, period)
##  fname – allows defining the exact file name of the saved file. 
##  mode – allows appending results of subsequent simulations (mode=’a’) to a csv file, or overwriting it (mode=’b’ by default). Mode=’a’ allows, for example, to store the value
##  of some expression for all periods in the same file (instead of one file per period by default).
####################################################################

               
            csv_output():
               - replacement: if(status1y==1 and status>=4, True, False)
               - replacement_inflow: if(status==1 and status1y>=4, True, False)
               - matched: if(status==EMPLOYED and ((hatlev5==5 and qual==1) or (hatlev5==4 and qual==2) or (hatlev5==3 and qual==3) or (hatlev5==4 and qual==3) or (hatlev5==1 and qual==4)), True, False)
               - csv(period, groupby(period, sex, status, age, immigrant, destination, immigrant_new, period), fname='lab_supply_age.csv', mode='a')
               - csv(period, groupby(period, sex, status, nace, destination, qual, immigrant, immigrant_new, period), fname='nace_immigrant.csv', mode='a')
               - csv(period, groupby(period, sex, lag(nace), destination, hatlev5, replacement, status,status1y, period), fname='replacement_hatlev_1.csv', mode='a')
               - csv(period, groupby(period, sex, immigrant, replacement, status,qual, nace, period), fname='replacement_hatlev_2.csv', mode='a')
